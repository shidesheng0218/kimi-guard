<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1440px; }
  body {
    font-family:"PingFang SC",-apple-system,sans-serif;
    color:#3b3733; position:relative; overflow:hidden;
    background:
      linear-gradient(rgba(72,105,160,.075) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(72,105,160,.075) 1.5px, transparent 1.5px),
      #fbf8ee;
    background-size:45px 45px;
  }
  .hand { font-family:"Marker Felt","Bradley Hand",cursive; }
  .wrap { position:absolute; inset:0; padding:80px 72px; display:flex; flex-direction:column; }
  .wrap > * { flex-shrink:0; }

  .title { font-size:54px; font-weight:700; }
  .title .hl { background:linear-gradient(180deg, transparent 52%, rgba(255,214,64,.85) 52%, rgba(255,214,64,.85) 92%, transparent 92%); padding:0 6px; }
  .title .hand { font-size:56px; }
  .subline { margin-top:10px; font-size:26px; color:#8a8177; font-weight:500; }

  .list { margin-top:44px; display:flex; flex-direction:column; gap:20px; }
  .row { background:#fff; border:2.5px solid #3b3733; padding:20px 26px;
         display:flex; align-items:center; gap:22px;
         box-shadow:2px 2px 0 rgba(59,55,51,.10); }
  .row:nth-child(odd)  { border-radius:255px 15px 225px 15px/15px 225px 15px 255px; transform:rotate(-.5deg); }
  .row:nth-child(even) { border-radius:15px 255px 15px 225px/225px 15px 255px 15px; transform:rotate(.45deg); }

  .cb { flex:none; width:44px; height:44px; }
  .label { font-size:28px; font-weight:600; flex:1; line-height:1.3; }
  .act { flex:none; font-size:24px; font-weight:700; padding:6px 18px; white-space:nowrap; }

  .sp { flex:1; }

  .marginnote { display:flex; align-items:center; gap:18px; background:#fff;
    border:2px dashed #b3a68f; border-radius:18px; padding:22px 28px; transform:rotate(-.6deg); }
  .marginnote .txt { font-size:26px; font-weight:600; color:#6b6052; }
  .foot { margin-top:26px; text-align:center; font-size:24px; color:#8a8177; }
</style>
</head>
<body>
<div class="wrap">

  <div class="title"><span class="hand">kimi-guard</span> 帮你<span class="hl">拦下这些</span> ✋</div>
  <div class="subline">别等 token 烧完了才发现它在原地打转</div>

  <div class="list">
    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">同一个调用重复 70+ 次</div>
      <div class="act" style="color:#c0392b; border:2.5px solid #c0392b; border-radius:60% 40% 55% 45%/50% 60% 40% 55%; transform:rotate(-2deg)">拦下</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">A→B→A→B 死循环</div>
      <div class="act" style="color:#c0392b; border:2.5px solid #c0392b; border-radius:45% 55% 40% 60%/55% 45% 60% 40%; transform:rotate(1.5deg)">打断</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">一个文件改来改去不收敛</div>
      <div class="act" style="color:#b4690e; border:2.5px solid #b4690e; border-radius:55% 45% 60% 40%/40% 55% 45% 60%; transform:rotate(-1.5deg)">提醒→拦</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">参数不同，结果一字不差</div>
      <div class="act" style="color:#b4690e; border:2.5px solid #b4690e; border-radius:40% 60% 45% 55%/60% 40% 55% 45%; transform:rotate(2deg)">警告→拦</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">配额快到上限</div>
      <div class="act" style="color:#b4690e; border:2.5px solid #b4690e; border-radius:60% 40% 55% 45%/50% 60% 40% 55%; transform:rotate(-2deg)">提前预警</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">中断 / 失败 / 结束</div>
      <div class="act" style="color:#2c6e49; border:2.5px solid #2c6e49; border-radius:45% 55% 40% 60%/55% 45% 60% 40%; transform:rotate(1.5deg)">存档续跑</div>
    </div>

    <div class="row">
      <svg class="cb" viewBox="0 0 44 44"><rect x="5" y="6" width="34" height="32" rx="6" fill="none" stroke="#3b3733" stroke-width="3"/><path d="M11 22 L19 31 L34 12" fill="none" stroke="#2c6e49" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="label">AI 说"测试全过了"</div>
      <div class="act" style="color:#c0392b; border:2.5px solid #c0392b; border-radius:55% 45% 60% 40%/40% 55% 45% 60%; transform:rotate(-1.5deg)">没证据打回</div>
    </div>
  </div>

  <div class="sp"></div>

  <div class="marginnote">
    <svg width="46" height="46" viewBox="0 0 46 46"><path d="M23 3 L27.5 16 L41 16.5 L30 25 L34 38.5 L23 30.5 L12 38.5 L16 25 L5 16.5 L18.5 16 Z" fill="rgba(255,214,64,.5)" stroke="#e1a400" stroke-width="2.5" stroke-linejoin="round"/></svg>
    <div class="txt">不碰源码 · 不开代理 · 不要账号授权 —— 挂在官方 hooks 上就完事</div>
  </div>

  <div class="foot hand">github.com/shidesheng0218/kimi-guard</div>
</div>
</body>
</html>
