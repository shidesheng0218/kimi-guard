<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1080px; }
  body {
    font-family:"PingFang SC",-apple-system,sans-serif; color:#3b3733;
    position:relative; overflow:hidden;
    background:
      linear-gradient(rgba(72,105,160,.075) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(72,105,160,.075) 1.5px, transparent 1.5px),
      #fbf8ee;
    background-size:45px 45px;
  }
  .hand { font-family:"Marker Felt","Bradley Hand",cursive; }
  .wrap { position:absolute; inset:0; padding:40px 64px; display:flex; flex-direction:column; }
  .wrap > * { flex-shrink:0; }

  .title { font-size:44px; font-weight:700; text-align:center; }
  .title .hl { background:linear-gradient(180deg, transparent 52%, rgba(255,214,64,.85) 52%, rgba(255,214,64,.85) 92%, transparent 92%); padding:0 6px; }

  /* polaroid */
  .polaroid { position:relative; margin:36px auto 0; width:800px; background:#fff;
    padding:22px 22px 64px; transform:rotate(-2deg);
    border:2px solid #e4ddd0; box-shadow:3px 5px 0 rgba(59,55,51,.12), 8px 14px 28px rgba(59,55,51,.12); }
  .polaroid img { display:block; width:100%; border:1.5px solid #d8d2c4; }
  .polaroid .caption { position:absolute; bottom:14px; left:0; right:0; text-align:center;
    font-size:25px; font-weight:600; color:#6b645c; }
  .tape { position:absolute; width:130px; height:34px; background:rgba(248,214,124,.62);
          box-shadow:0 1px 3px rgba(0,0,0,.10); }
  .t1 { top:-16px; left:60px; transform:rotate(-7deg); }
  .t2 { top:-16px; right:60px; transform:rotate(6deg); }

  .notes { margin-top:34px; display:flex; align-items:flex-start; gap:20px; }
  .note-arrow { flex:none; }
  .note-text { font-size:28px; font-weight:600; line-height:1.45; }
  .note-text .red { color:#c0392b; font-weight:800; border-bottom:3px solid #d94f3d; }
  .foot { margin-top:18px; text-align:center; font-size:23px; color:#8a8177; }
  .foot .hand { font-size:24px; }
</style>
</head>
