name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the CHANGELOG section for this tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # section header looks like: ## 0.8.1 — 2026-09-02
          awk -v ver="$VER" '$0 ~ "^## " ver " " {p=1; next} p && /^## / {exit} p' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "using changelog notes for $VER"
          else
            echo "no changelog section for $VER — will use generated notes"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi
